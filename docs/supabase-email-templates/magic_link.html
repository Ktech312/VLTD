<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>VLTD</title>
</head>
<body style="margin:0;padding:0;background:#05080C;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">Tap to log in to VLTD.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#05080C" style="background:#05080C;">
<tr><td align="center" style="padding:28px 12px 40px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
    <tr><td align="center" style="padding:8px 0 24px 0;">
      <a href="https://vltd.app" target="_blank" style="text-decoration:none;"><img src="https://vltd.app/email/vltd-logo-platinum.png" width="168" alt="VLTD, pronounced Vaulted" style="display:block;border:0;outline:none;width:168px;max-width:100%;height:auto;color:#E8EDF2;font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;"></a>
    </td></tr>
    <tr><td bgcolor="#0E141B" style="background:#0E141B;border:1px solid #1D2A35;border-top:3px solid #41C6E4;border-radius:12px;padding:32px 28px 20px 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td style="padding:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:28px;font-weight:700;color:#E8EDF2;">{{ if .Data.first_name }}Hi {{ .Data.first_name }},{{ else }}Hi there,{{ end }}</td></tr>
<tr><td style="padding:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#E8EDF2;">Use the button below to log in to VLTD.</td></tr>
<tr><td align="center" style="padding:8px 0 24px 0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"><tr>
<td align="center" bgcolor="#41C6E4" style="border-radius:8px;background:#41C6E4;background-image:linear-gradient(180deg,#79E7FB,#41C6E4);">
<a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;min-width:220px;padding:16px 28px;font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:20px;font-weight:700;color:#06171D;text-decoration:none;border-radius:8px;text-align:center;">Log in to VLTD</a>
</td></tr></table>
</td></tr>
<tr><td style="padding:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#E8EDF2;">If you didn’t ask for this, you can ignore this email.</td></tr>
<tr><td style="padding:0 0 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#E8EDF2;">Need a hand? <a href="https://vltd.app/guide" style="color:#41C6E4;text-decoration:underline;">We’re here to help</a>.</td></tr>
        <tr><td style="padding:8px 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#E8EDF2;">— The VLTD Team</td></tr>
      </table>
    </td></tr>
    <tr><td align="center" style="padding:20px 8px 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#9AA7B3;">VLTD, pronounced &ldquo;Vaulted&rdquo; &middot; <a href="https://vltd.app" style="color:#9AA7B3;">vltd.app</a></td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
